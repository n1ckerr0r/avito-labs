services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tripgo
      POSTGRES_PASSWORD: tripgo
      POSTGRES_DB: tripgo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripgo -d tripgo"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -dir
      - /migrations
      - postgres
      - postgres://tripgo:tripgo@postgres:5432/tripgo?sslmode=disable
      - up

  trip-service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: service
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://tripgo:tripgo@postgres:5432/tripgo?sslmode=disable
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT: 10s
      DATABASE_MAX_CONNS: 10
      DATABASE_MIN_CONNS: 2
      DATABASE_CONNECT_TIMEOUT: 5s
      DATABASE_QUERY_TIMEOUT: 3s
      DATABASE_MAX_CONN_LIFETIME: 1h
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"

volumes:
  postgres-data:
